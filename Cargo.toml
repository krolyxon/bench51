[workspace]
resolver = "3"
members = ["crates/bench51-core", "crates/bench51-tui", "crates/bench51-gui"]

[workspace.package]
version = "0.2.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
bench51-core = { path = "crates/bench51-core" }
clap = { version = "4.5.54", features = ["derive"] }

# egui and wgpu are unusably slow without optimisation; keep our own crates
# quick to rebuild.
[profile.dev.package."*"]
opt-level = 2
